name: bob

services:
  model-server:
    labels:
      - "flame.type=application"
      - "flame.name=Model Server"
      - "flame.url=http://model-server:6060"
    image: ghcr.io/ggml-org/llama.cpp:full-cuda
    # Published on localhost only: the endpoint has no auth. Set BOB_BIND=0.0.0.0
    # in .env to expose it (and the OpenCode web UI) on the network.
    ports:
      - "${BOB_BIND:-127.0.0.1}:6060:6060"
    volumes:
      - ./models:/models
      - ./config/config.generated.ini:/config/config.ini
    command:
      [
        "--server",
        "--models-dir",
        "/models",
        "--models-preset",
        "/config/config.ini",
        "--host",
        "0.0.0.0",
        "--port",
        "6060",
        "--no-warmup",
        "--models-max",
        "1",
        "--tools",
        "all",
      ]
    gpus: all
    runtime: nvidia
    shm_size: "2gb"

  # One-shot sidecar that downloads every model declared in stack.yaml.
  # Disabled during normal `up` via a profile; run with:
  #   docker compose --profile download run --rm model-downloader
  # Pass HF_TOKEN (env) for gated repos / rate limits.
  model-downloader:
    profiles: ["download"]
    build:
      context: ./docker
      dockerfile: model-downloader.Dockerfile
    working_dir: /workspace
    volumes:
      - ./models:/models
      - ./config:/config
      - ./stack.yaml:/workspace/stack.yaml:ro
      - ./scripts:/workspace/scripts:ro
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    command:
      - /workspace/scripts/bootstrap.py
      - --config
      - /workspace/stack.yaml
      - --models-dir
      - /models
      - --config-dir
      - /config
      - download
      - --verify

  # OpenCode 2 agent (https://opencode.ai), pointed at the model-server's
  # OpenAI-compat endpoint. Config (opencode.json) is generated from stack.yaml
  # (`./ctl.sh generate`) and mounted into ~/.config/opencode.
  #
  # `opencode serve` hosts the API + web UI on http://localhost:8008. It is
  # password-protected: OPENCODE_PASSWORD from .env, else a password generated
  # once into config/opencode/server-password. The container can drive the host
  # docker daemon through the mounted socket, so the port is published on
  # localhost only unless BOB_BIND says otherwise.
  #
  # Start with (add --no-deps to skip the model-server, e.g. for UI testing):
  #   docker compose --profile opencode up -d opencode
  opencode:
    profiles: ["opencode"]
    build:
      context: ./docker
      dockerfile: opencode.Dockerfile
    ports:
      - "${BOB_BIND:-127.0.0.1}:8008:8008"
    working_dir: /workspace
    volumes:
      - ./config/opencode:/home/agent/.config/opencode
      - ./config/opencode-data:/home/agent/.local/share/opencode
      - ${BOB_WORKSPACE:-.}:/workspace   # project the agent works on (default: this repo)
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - OPENCODE_PASSWORD   # passed through from host env / .env when set
    depends_on:
      - model-server
