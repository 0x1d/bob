name: bob

services:
  model-server:
    labels:
      - "flame.type=application"
      - "flame.name=Model Server"
      - "flame.url=http://model-server:6060"
    image: ghcr.io/ggml-org/llama.cpp:full-cuda
    ports:
      - "6060:6060"
    volumes:
      - ./models:/models
      - ./config/config.generated.ini:/config/config.ini
    command:
      [
        "--server",
        "--models-dir",
        "/models",
        "--models-preset",
        "/config/config.ini",
        "--host",
        "0.0.0.0",
        "--port",
        "6060",
        "--no-warmup",
        "--models-max",
        "1",
        "--tools",
        "all",
      ]
    gpus: all
    runtime: nvidia
    shm_size: "2gb"

  # One-shot sidecar that downloads every model declared in stack.yaml.
  # Disabled during normal `up` via a profile; run with:
  #   docker compose --profile download run --rm model-downloader
  # Pass HF_TOKEN (env) for gated repos / rate limits.
  model-downloader:
    profiles: ["download"]
    build:
      context: ./docker
      dockerfile: model-downloader.Dockerfile
    working_dir: /workspace
    volumes:
      - ./models:/models
      - ./config:/config
      - ./stack.yaml:/workspace/stack.yaml:ro
      - ./scripts:/workspace/scripts:ro
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    command:
      - /workspace/scripts/bootstrap.py
      - --config
      - /workspace/stack.yaml
      - --models-dir
      - /models
      - --config-dir
      - /config
      - download
      - --verify

  # OpenCode agent (https://opencode.ai), pointed at the model-server's
  # OpenAI-compat endpoint. Config (opencode.json) is generated from stack.yaml:
  #   python3 scripts/bootstrap.py generate-opencode-config
  # and mounted into ~/.config/opencode. The web UI is exposed on host port 8008.
  # Start with:
  #   docker compose --profile opencode up -d opencode
  opencode:
    profiles: ["opencode"]
    build:
      context: ./docker
      dockerfile: opencode.Dockerfile
    ports:
      - "8008:8008"
    working_dir: /workspace
    volumes:
      - ./config/opencode:/home/agent/.config/opencode
      - ./config/opencode-data:/home/agent/.local/share/opencode
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - OPENCODE_CONFIG=/home/agent/.config/opencode/opencode.json
      - OPENCODE_DATA_DIR=/home/agent/.local/share/opencode
    gpus: all            # so nvtop / CUDA tooling can see the device
    runtime: nvidia
    depends_on:
      - model-server
