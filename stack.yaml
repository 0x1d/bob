      - name: mmproj-Qwen3.5-4B-Uncensored-HauhauCS-Aggressive-BF16.gguf
        kind: mmproj
    settings:
      ctx-size: 200000
      temp: 0.7
      top-p: 0.8
      top-k: 20
      min-p: 0
      repeat-penalty: 1.05   # anti-loop guardrail (see Qwythos card retest)
      ngl: 100
      no-prefill-assistant: true
      cache-type-k: q4_0
      cache-type-v: q4_0
      chat-template-kwargs: {enable_thinking: false}
      reasoning-budget: 0
    card:
      url: https://huggingface.co/HauhauCS/Qwen3.5-4B-Uncensored-HauhauCS-Aggressive
      thinking: {temp: 0.6, top-p: 0.95, top-k: 20, min-p: 0}
      non-thinking: {temp: 0.7, top-p: 0.8, top-k: 20, min-p: 0}
      context: 262144 native, 1048576 with YaRN; keep >= 128K to preserve thinking
