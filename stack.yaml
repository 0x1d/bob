# ============================================================================
# llama.cpp stack bootstrap configuration (single source of truth)
# ----------------------------------------------------------------------------
# This file abstracts config/config.ini AND describes how to download every
# model. The bootstrap generator (scripts/bootstrap.py) reads this file and:
#   * `generate-config` -> writes a llama-server models-preset (config.ini)
#   * `download`        -> fetches every missing GGUF/mmproj from HF
#   * `status`          -> reports presence/size of every declared file
#
# Mapping to config.ini (the [name] header is a llama-server preset entry):
#   [name]              = model.name
#   model               = {container_models_dir}/{dir}/{files[model]}
#   mmproj              = {container_models_dir}/{dir}/{files[mmproj]}
#   every key under `settings` -> `key = value` line (order preserved)
#
# The top level is split into concerns so it can grow beyond a model server.
# `models:` is the llama-server model roster (downloaded + configured here).
# Future extensions (e.g. `agents:` for CLI AI agent wiring that references a
# model by `name`) can be added without disturbing `models:`.
# ============================================================================
# Paths:
#   container_models_dir -> path INSIDE the llama-server container (compose mount)
#   host_models_dir      -> path on the host (used by the downloader sidecar)
# ============================================================================

stack:
  host_models_dir: ./models            # host path mounted into llama-server
  container_models_dir: /models        # path inside the llama-server container
  host_config_dir: ./config            # host dir holding the generated preset + pi config
  container_config_path: /config/config.ini
  generated_config_name: config.generated.ini   # the preset the llama-server mounts

pi:
  provider: bob-stack                # provider key written into pi models.json
  base_url: http://model-server:6060/v1  # OpenAI-compat endpoint reachable from the pi container (compose network)
  default_model: Qwen3.5-2B-Uncensored-Q4_K_M  # model name (from `models:` below) selected by default in /model
  # api_key_env: BOB_API_KEY          # optional; unset => dummy "none" (server has no auth)

huggingface:
  token_env: HF_TOKEN                   # read token from this env var (optional)
  base_url: https://huggingface.co

# ---------------------------------------------------------------------------
# Models. `settings` order is preserved verbatim in the generated config.ini.
# `card` documents the upstream recommendation + source URL for traceability
# and is NOT emitted into config.ini.
# ---------------------------------------------------------------------------
models:

  - name: Qwen3.5-2B-Uncensored-Q4_K_M
    dir: Qwen3.5-2B-Uncensored-Q4_K_M
    repo: HauhauCS/Qwen3.5-2B-Uncensored-HauhauCS-Aggressive
    quant: Q4_K_M
    family: qwen3.5
    thinking: true
    files:
      - name: Qwen3.5-2B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf
        kind: model
      - name: mmproj-Qwen3.5-2B-Uncensored-HauhauCS-Aggressive-f16.gguf
        kind: mmproj
    settings:
      ctx-size: 200000
      temp: 0.6
      top-p: 0.95
      top-k: 20
      min-p: 0
      repeat-penalty: 1.05   # anti-loop guardrail (see Qwythos card retest)
      ngl: 100
      no-prefill-assistant: true
      cache-type-k: q4_0
      cache-type-v: q4_0
    card:
      url: https://huggingface.co/HauhauCS/Qwen3.5-2B-Uncensored-HauhauCS-Aggressive
      thinking: {temp: 0.6, top-p: 0.95, top-k: 20, min-p: 0}
      non-thinking: {temp: 0.7, top-p: 0.8, top-k: 20, min-p: 0}
      context: 262144 native, 1048576 with YaRN; keep >= 128K to preserve thinking
      multimodal: true   # requires mmproj alongside main GGUF
      mtp: true
      anti-loop: repeat-penalty 1.05 is a stack-level guardrail; qwen3.5 reasoning models degenerate into repetition loops at greedy/T<=0.3 (documented on Qwythos card retest)

  - name: Qwen3.5-4B-NoThink
    dir: Qwen3.5-4B-Uncensored-Q4_K_M
