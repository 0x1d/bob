  - name: Qwen3.6-35B-A3B-UD-Q4_K_M
    dir: Qwen3.6-35B-A3B-UD-Q4_K_M
    repo: unsloth/Qwen3.6-35B-A3B-GGUF
    quant: UD-Q4_K_M
    family: qwen3.6
    thinking: true
    files:
      - name: Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
        kind: model
    settings:
      ctx-size: 131072
      ubatch-size: 512
      ngl: 41
      no-mmap: true
      n-cpu-moe: 40   # sensible for ~10GB VRAM (40 MoE layers, ~530MB/layer; 35-40 for <=12GB, raise if OOM)
      flash-attn: on
      cache-type-k: q8_0
      cache-type-v: q8_0
      temp: 0.6
      top-p: 0.95
      top-k: 20
      min-p: 0
      repeat-penalty: 1.05   # anti-loop guardrail (see Qwythos card retest)
    card:
      url: https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF
      source: reddit user report (~50 t/s on RTX 5070 Ti mobile 12GB VRAM + 32GB RAM)
      load-tuning: {ctx: 131072, ub: 512, ngl: 41, ncpumoe: 31, fa: on, kvcache: q8}
      context: ">=128K recommended for reasoning models"
      multimodal: false  # disabled; mmproj not downloaded/served for this entry
      mtp: false         # this GGUF has no MTP layers; draft-mtp aborts load (see log 2026-08-25)
      anti-loop: repeat-penalty 1.05 is a stack-level guardrail (see Qwythos card retest)

  - name: Qwen3.6-35B-A3B-UD-Q4_K_M-Fit
    dir: Qwen3.6-35B-A3B-UD-Q4_K_M
    repo: unsloth/Qwen3.6-35B-A3B-GGUF
    quant: UD-Q4_K_M
    family: qwen3.6
    thinking: true
    files:
      - name: Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
        kind: model
    settings:
      fit: on
      fit-ctx: 120000
      fit-target: 1024   # MiB headroom; tune up if cache checkpoints leak into VRAM
      kv-unified: true
      no-mmap: true
      mlock: true
      parallel: 1
      cache-ram: 2048    # MiB; critical with ctx-checkpoints as session grows
      ctx-checkpoints: 4
      batch-size: 512
      ubatch-size: 512
      cache-type-k: q8_0
      cache-type-v: q8_0
      cache-type-k-draft: q8_0
      cache-type-v-draft: q8_0
      temp: 0.6
      top-p: 0.95
      top-k: 20
      min-p: 0
      repeat-penalty: 1.1
      chat-template-kwargs: {preserve_thinking: true}
    card:
      url: https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF
      source: reddit user follow-up profile (--fit autotuning variant of the base entry)
      load-tuning: {fit: on, fit-ctx: 120000, fit-target: 1024, kv-unified: true, no-mmap: true, mlock: true, parallel: 1, cram: 2048, ctxcp: 4}
      note: shares the same GGUF file/dir as Qwen3.6-35B-A3B-UD-Q4_K_M; no extra download
      multimodal: false
      mtp: false         # this GGUF has no MTP layers; draft-mtp aborts load (see log 2026-08-25)
      anti-loop: repeat-penalty raised to 1.1 per source recommendation

